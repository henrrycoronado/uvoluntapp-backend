# Entorno local de Uvoluntapp: PostgreSQL 16, Redis y Mailpit.
#
# Puertos publicados en localhost (sobrescribibles desde .env):
#   - PostgreSQL: 5432  (POSTGRES_PORT)
#   - Redis:      6379  (REDIS_PORT)
#   - API:        http://localhost:5207 (API_PORT)
#   - Mailpit:    SMTP 1025 (MAILPIT_SMTP_PORT) y UI http://localhost:8025 (MAILPIT_UI_PORT)
#
# Uso: docker compose up -d postgres redis mailpit

name: uvoluntapp-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uvoluntapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-uvoluntapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-uvoluntapp};Username=${POSTGRES_USER:-uvoluntapp};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      REDIS_CONNECTION_STRING: redis:6379
      MAILPIT_HOST: mailpit
      MAILPIT_SMTP_PORT: "1025"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "${API_PORT:-5207}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  mailpit_data:
    driver: local
